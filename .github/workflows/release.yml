name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in package.json (for example, 0.10.0)'
        required: true
        type: string
      commit:
        description: 'Exact 40-character commit SHA of the selected ref (build only)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release candidate
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      tag_object: ${{ steps.candidate.outputs.tag_object }}
      already_published: ${{ steps.candidate.outputs.already_published }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
      previous_version: ${{ steps.candidate.outputs.previous_version }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact version, tag, and commit
        id: candidate
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          test "$COMMIT" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            test "$COMMIT" = "$REQUESTED_COMMIT"
          fi
          IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$IDENTIFIER(\.$IDENTIFIER)*)?$ ]]
          TAG="v$VERSION"
          jq -e --arg version "$VERSION" '.version == $version' package.json >/dev/null
          jq -e --arg version "$VERSION" '.version == $version and .packages[""].version == $version' package-lock.json >/dev/null
          node scripts/changelog-release-notes.js --current "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name,.draft,.prerelease] | @tsv')
          TAG_OBJECT=
          ALREADY_PUBLISHED=false
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF" = "refs/tags/$TAG"
            REMOTE_TAG=$(git ls-remote --exit-code origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
            TAG_OBJECT=$(awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }' <<< "$REMOTE_TAG")
            TAG_COMMIT=$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }' <<< "$REMOTE_TAG")
            test "$COMMIT" = "${TAG_COMMIT:-$TAG_OBJECT}"
            if awk -F '\t' -v tag="$TAG" '$1 == tag && $2 == "false" { found = 1 } END { exit !found }' <<< "$RELEASES"; then
              echo "Release $TAG is already published."
              ALREADY_PUBLISHED=true
            else
              test "$COMMIT" = "$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            fi
          fi
          PREVIOUS_TAG=$(awk -F '\t' -v tag="$TAG" '$1 != tag && $2 == "false" && $3 == "false" { print $1; exit }' <<< "$RELEASES")
          PREVIOUS_VERSION=${PREVIOUS_TAG#v}
          printf 'tag=%s\nversion=%s\ncommit=%s\ntag_object=%s\nalready_published=%s\nprevious_tag=%s\nprevious_version=%s\n' "$TAG" "$VERSION" "$COMMIT" "$TAG_OBJECT" "$ALREADY_PUBLISHED" "$PREVIOUS_TAG" "$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.candidate.outputs.already_published == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.candidate.outputs.already_published == 'false'
        run: npm ci

      - name: Install Chromium for measured quality gates
        if: steps.candidate.outputs.already_published == 'false'
        run: npx playwright install --with-deps chromium

      - name: Run shared source quality contract
        if: steps.candidate.outputs.already_published == 'false'
        run: npm run quality:check -- --profile=release-source
        env:
          CI: true

      - name: Upload source quality evidence
        if: always() && steps.candidate.outputs.already_published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: release-source-quality-evidence
          path: quality/evidence/
          if-no-files-found: ignore

  build:
    name: Build and smoke ${{ matrix.os }}
    needs: verify
    if: needs.verify.outputs.already_published == 'false'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prove candidate still matches checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.verify.outputs.commit }}"
          test "$(node -p "require('./package.json').version")" = "${{ needs.verify.outputs.version }}"

      - name: Download previous published package for upgrade smoke
        if: needs.verify.outputs.previous_tag != ''
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
          PREVIOUS_VERSION: ${{ needs.verify.outputs.previous_version }}
          PREVIOUS_DIR: ${{ runner.temp }}/previous-release
        run: |
          set -euo pipefail
          mkdir -p "$PREVIOUS_DIR"
          case "${{ runner.os }}" in
            Linux) ARTIFACT_PATTERN="*-Linux-$PREVIOUS_VERSION.AppImage" ;;
            Windows) ARTIFACT_PATTERN="*-Windows-$PREVIOUS_VERSION-Setup.exe" ;;
            macOS) ARTIFACT_PATTERN="*-Mac-$PREVIOUS_VERSION-Installer.dmg" ;;
            *) echo 'unsupported release runner' >&2; exit 1 ;;
          esac
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_PATTERN" --dir "$PREVIOUS_DIR"
          ARTIFACT_PATH="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name "$ARTIFACT_PATTERN" -print)"
          test -n "$ARTIFACT_PATH"
          test "$(printf '%s\n' "$ARTIFACT_PATH" | wc -l | tr -d ' ')" = 1
          printf 'path=%s\n' "$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Require privacy-reviewed analytics configuration
        shell: bash
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: test -n "$VITE_POSTHOG_PROJECT_TOKEN"

      - name: Build release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: npm run build -- --publish never

      - name: Capture local release evidence
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/release-evidence
          PREVIOUS_ARTIFACT: ${{ steps.previous.outputs.path }}
          PREVIOUS_VERSION: ${{ needs.verify.outputs.previous_version }}
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          SMOKE_ARGS=(--release-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --output "$EVIDENCE_ROOT/${{ runner.os }}-package-smoke.json")
          if [ -n "$PREVIOUS_ARTIFACT" ]; then
            SMOKE_ARGS+=(--previous-artifact "$PREVIOUS_ARTIFACT" --previous-version "$PREVIOUS_VERSION")
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/package-smoke.js "${SMOKE_ARGS[@]}"
          else
            node scripts/package-smoke.js "${SMOKE_ARGS[@]}"
          fi
          node scripts/release-evidence.js --artifacts-dir release/${{ needs.verify.outputs.version }} --version ${{ needs.verify.outputs.version }} --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --output "$EVIDENCE_ROOT/${{ runner.os }}-release-evidence.json"
          cp release/${{ needs.verify.outputs.version }}/SHA256SUMS.txt release/${{ needs.verify.outputs.version }}/SHA256SUMS-${{ runner.os }}.txt

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: release-package-${{ runner.os }}
          path: |
            release/${{ needs.verify.outputs.version }}/*.dmg
            release/${{ needs.verify.outputs.version }}/*.exe
            release/${{ needs.verify.outputs.version }}/*.AppImage
            release/${{ needs.verify.outputs.version }}/latest*.yml
            release/${{ needs.verify.outputs.version }}/*.blockmap
            release/${{ needs.verify.outputs.version }}/SHA256SUMS-${{ runner.os }}.txt
          if-no-files-found: error

      - name: Upload host smoke and contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: release-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error

  verify-evidence:
    name: Verify downloaded artifact evidence
    needs: [verify, build]
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.report.outputs.path }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download source quality evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-source-quality-evidence
          path: quality/evidence

      - name: Download all platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-package-*
          path: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
          merge-multiple: true

      - name: Download platform smoke and contract evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/downloaded-evidence

      - name: Verify build-generated platform manifests
        shell: bash
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          count=0
          for manifest in "$RELEASE_ASSETS"/SHA256SUMS-*.txt; do
            test -f "$manifest"
            (cd "$RELEASE_ASSETS" && sha256sum --check "$(basename "$manifest")")
            count=$((count + 1))
          done
          test "$count" -eq 3
          rm "$RELEASE_ASSETS"/SHA256SUMS-*.txt

      - name: Verify downloaded release artifacts
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          mkdir -p "$VERIFIED_EVIDENCE"
          xvfb-run --auto-servernum node scripts/package-smoke.js --release-dir "$RELEASE_ASSETS" --version ${{ needs.verify.outputs.version }} --output "$VERIFIED_EVIDENCE/downloaded-package-smoke.json"
          node scripts/release-evidence.js --artifacts-dir "$RELEASE_ASSETS" --version ${{ needs.verify.outputs.version }} --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --output "$VERIFIED_EVIDENCE/release-evidence.json"

      - name: Aggregate host smoke evidence
        shell: bash
        env:
          DOWNLOADED_EVIDENCE: ${{ runner.temp }}/downloaded-evidence
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
        run: |
          AGGREGATE_ARGS=(--input "$DOWNLOADED_EVIDENCE" --output "$VERIFIED_EVIDENCE/platform-smoke.json")
          if [ -n "$PREVIOUS_TAG" ]; then AGGREGATE_ARGS+=(--require-upgrade); fi
          node scripts/aggregate-platform-smoke.js "${AGGREGATE_ARGS[@]}"

      - name: Validate schema-bound pre-push report
        id: report
        shell: bash
        env:
          VERIFIED_EVIDENCE: ${{ runner.temp }}/verified-release-evidence
        run: |
          test -f quality/schemas/prepush-release-report.schema.json
          node scripts/prepush-release-report.js --tag ${{ needs.verify.outputs.tag }} --commit ${{ needs.verify.outputs.commit }} --version ${{ needs.verify.outputs.version }} --quality quality/evidence/quality-contract.json --release-evidence "$VERIFIED_EVIDENCE/release-evidence.json" --platform-smoke "$VERIFIED_EVIDENCE/platform-smoke.json" --output "$VERIFIED_EVIDENCE/prepush-release-report.json"
          printf 'path=%s\n' "$VERIFIED_EVIDENCE/prepush-release-report.json" >> "$GITHUB_OUTPUT"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: verified-release-evidence
          path: ${{ runner.temp }}/verified-release-evidence/
          if-no-files-found: error

      - name: Upload only verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: verified-release-assets
          path: ${{ runner.temp }}/release-assets/${{ needs.verify.outputs.version }}/
          if-no-files-found: error

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && needs.verify.outputs.already_published == 'false'
    needs: [verify, verify-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Repository environment rules apply to this tag deployment.
    environment: release-publication
    steps:
      - name: Checkout the approved candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0

      - name: Download verified release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release-evidence
          path: release-evidence

      - name: Download verified platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-release-assets
          path: release-assets

      - name: Publish verified release assets for existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg tag "$TAG" --arg commit "$COMMIT" '.candidate.tag == $tag and .candidate.commit == $commit' release-evidence/prepush-release-report.json >/dev/null
          test "$COMMIT" = "$(git rev-parse HEAD)"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          verify_remote_candidate() {
            test "$COMMIT" = "$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            test "$TAG_OBJECT" = "$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          }
          test -n "$TAG_OBJECT"
          test "$TAG_OBJECT" = "$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name,.draft] | @tsv')
          RELEASE_STATE=$(awk -F '\t' -v tag="$TAG" '$1 == tag { print $2; exit }' <<< "$RELEASES")
          if [[ "$RELEASE_STATE" == false ]]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          if [[ "$RELEASE_STATE" == true ]]; then
            echo "A draft already exists for $TAG. Review it before retrying publication." >&2
            exit 1
          fi

          node scripts/changelog-release-notes.js --current "${TAG#v}" --output release-notes.md
          RELEASE_FLAGS=()
          LATEST=--latest
          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease)
            LATEST=--latest=false
          fi
          verify_remote_candidate
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --notes-file release-notes.md --draft "${RELEASE_FLAGS[@]}"
          RELEASE_ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId')
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          for asset in release-assets/*; do
            digest=$(sha256sum -- "$asset")
            printf '%s\tuploaded\tsha256:%s\n' "${asset##*/}" "${digest%% *}"
          done | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets.tsv"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | [.name,.state,.digest] | @tsv' |
            LC_ALL=C sort > "$RUNNER_TEMP/uploaded-release-assets.tsv"
          diff -u "$RUNNER_TEMP/expected-release-assets.tsv" "$RUNNER_TEMP/uploaded-release-assets.tsv"
          verify_remote_candidate
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false "$LATEST" "${RELEASE_FLAGS[@]}"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
